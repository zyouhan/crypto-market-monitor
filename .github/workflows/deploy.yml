name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-market-monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          umask 077

          KEY_FILE="$HOME/.ssh/deploy_key"
          KEY_SOURCE=""

          if [ -n "${DEPLOY_SSH_KEY_B64:-}" ]; then
            KEY_SOURCE="DEPLOY_SSH_KEY_B64"
            if ! printf '%s' "$DEPLOY_SSH_KEY_B64" \
              | base64 -d > "$KEY_FILE" 2> "$HOME/.ssh/b64-error.log"; then
              echo "DEPLOY_SSH_KEY_B64 不是合法的 Base64：" >&2
              cat "$HOME/.ssh/b64-error.log" >&2
              exit 1
            fi
          else
            if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
              echo "DEPLOY_SSH_KEY / DEPLOY_SSH_KEY_B64 未配置" >&2
              exit 1
            fi

            KEY_SOURCE="DEPLOY_SSH_KEY"

            # 兼容 GitHub Secret 中出现的字面量 \n 和 Windows CRLF
            printf '%s' "$DEPLOY_SSH_KEY" \
              | sed -e 's/\\n/\n/g' -e 's/\r$//' \
              > "$KEY_FILE"
            sed -i -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$KEY_FILE"
            sed -i '/./,$!d' "$KEY_FILE"

            # 确保文件以换行结尾
            if [ -s "$KEY_FILE" ] && [ "$(tail -c 1 "$KEY_FILE" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$KEY_FILE"
            fi
          fi

          chmod 600 "$KEY_FILE"

          echo "密钥来源: $KEY_SOURCE"
          echo "密钥首行: $(head -n 1 "$KEY_FILE" 2>/dev/null || true)"

          case "$(head -n 1 "$KEY_FILE" 2>/dev/null || true)" in
            "-----BEGIN "*)
              ;;
            *)
              echo "密钥首行不是 PEM/OpenSSH 私钥头。" >&2
              echo "常见原因：把 Base64 填到了 DEPLOY_SSH_KEY，或填入了 .pub 公钥。" >&2
              echo "使用 Base64 时请填 DEPLOY_SSH_KEY_B64；不要加引号、提示符或说明文字。" >&2
              exit 1
              ;;
          esac

          if ! ssh-keygen -y -P "" -f "$KEY_FILE" > "$HOME/.ssh/deploy_key.pub" 2> "$HOME/.ssh/key-error.log"; then
            echo "私钥无法解析，请检查 $KEY_SOURCE 内容：" >&2
            cat "$HOME/.ssh/key-error.log" >&2
            exit 1
          fi

          chmod 600 "$HOME/.ssh/deploy_key.pub"
          echo "已加载部署密钥："
          ssh-keygen -lf "$HOME/.ssh/deploy_key.pub"

          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/crypto-market-monitor}"

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$PATH_ON_SERVER' && bash scripts/deploy.sh '$EXPECTED_COMMIT'"
